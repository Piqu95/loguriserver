<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Loguri server</title>
<style>
  :root{
    --fundal:#14110e; --panou:#1d1915; --panou-2:#252019; --linie:#3a3128;
    --text:#e9e0d0; --text-sters:#9a8b74; --accent:#c9974f; --accent-tare:#e0b164;
    --verde:#6f9455; --rosu:#b4574a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--fundal); color:var(--text);
       font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  button,input,select{font:inherit}

  /* ---------------- login ---------------- */
  #login{min-height:100vh; display:grid; place-items:center; padding:1.5rem}
  #login form{width:100%; max-width:360px; background:var(--panou);
    border:1px solid var(--linie); border-radius:12px; padding:2rem 1.75rem}
  #login h1{font:700 1.35rem/1.2 Georgia,serif; margin:0 0 .35rem; color:var(--accent-tare)}
  #login p{margin:0 0 1.5rem; color:var(--text-sters); font-size:.88rem}
  label{display:block; font-size:.78rem; letter-spacing:.04em; text-transform:uppercase;
        color:var(--text-sters); margin:0 0 .35rem}
  #login input{width:100%; padding:.6rem .7rem; margin-bottom:1rem; background:var(--panou-2);
    border:1px solid var(--linie); border-radius:7px; color:var(--text)}
  input:focus,select:focus{outline:2px solid var(--accent); outline-offset:1px}
  button.principal{width:100%; padding:.65rem; background:var(--accent); color:#1a1408;
    border:0; border-radius:7px; font-weight:700; cursor:pointer}
  button.principal:hover{background:var(--accent-tare)}
  button.principal:disabled{opacity:.55; cursor:default}
  .eroare{color:var(--rosu); font-size:.85rem; margin:0 0 1rem; min-height:1.2em}

  /* ---------------- aplicatia ---------------- */
  #app{display:none; height:100vh; grid-template-columns:250px 1fr}
  #app.pornit{display:grid}

  aside{background:var(--panou); border-right:1px solid var(--linie);
        display:flex; flex-direction:column; min-height:0}
  aside h1{font:700 1.05rem/1 Georgia,serif; margin:0; padding:1.15rem 1.25rem .3rem;
           color:var(--accent-tare)}
  aside .cine{padding:0 1.25rem 1rem; color:var(--text-sters); font-size:.82rem}
  nav{flex:1; overflow-y:auto; padding:.35rem .6rem 1rem}

  nav .rand{display:flex; width:100%; align-items:baseline; justify-content:space-between;
    gap:.5rem; background:transparent; border:0; border-radius:7px; cursor:pointer;
    padding:.5rem .65rem; margin-bottom:.1rem; color:var(--text-sters); text-align:left}
  nav .rand:hover{background:var(--panou-2); color:var(--text)}
  nav .rand.activ{background:var(--panou-2); color:var(--accent-tare); font-weight:700}
  nav .rand .nr{font-size:.76rem; opacity:.75; font-variant-numeric:tabular-nums}
  nav .rand.capat{color:var(--text); font-weight:600; margin-top:.5rem}
  nav .sub .rand{padding-left:1.4rem; font-size:.88rem}
  /* subcategoriile se vad mereu, nu se desfac la click */
  nav .titlu{padding:.9rem .65rem .3rem; font-size:.7rem; letter-spacing:.08em;
             text-transform:uppercase; color:var(--text-sters); opacity:.7}

  /* blocul de stergere -- apare doar la proprietar, si e vopsit altfel decat restul,
     ca sa nu ajungi pe el din greseala cand vrei sa dai click pe o categorie */
  #administrare{padding:.7rem 1.25rem; border-top:1px solid var(--linie);
    display:flex; flex-direction:column; gap:.4rem}
  #administrare .titluAdmin{font-size:.7rem; letter-spacing:.08em; text-transform:uppercase;
    color:var(--text-sters); opacity:.7; margin-bottom:.1rem}
  button.periculos{border-color:color-mix(in srgb,var(--rosu) 50%,transparent);
    color:color-mix(in srgb,var(--rosu) 85%,var(--text))}
  button.periculos:hover{border-color:var(--rosu); color:var(--rosu);
    background:color-mix(in srgb,var(--rosu) 12%,transparent)}
  button.periculos:disabled{opacity:.5; cursor:default}

  aside footer{padding:.85rem 1.25rem; border-top:1px solid var(--linie);
    display:flex; align-items:center; justify-content:space-between; gap:.5rem}
  .versiune{font-size:.72rem; color:var(--text-sters); opacity:.6;
    font-variant-numeric:tabular-nums}
  button.mic{background:transparent; border:1px solid var(--linie); color:var(--text-sters);
    border-radius:7px; padding:.35rem .7rem; cursor:pointer; font-size:.82rem}
  button.mic:hover{border-color:var(--accent); color:var(--text)}

  main{display:flex; flex-direction:column; min-width:0; min-height:0}
  .bara{display:flex; gap:.6rem; flex-wrap:wrap; align-items:center;
    padding:.85rem 1.25rem; border-bottom:1px solid var(--linie)}
  .bara input,.bara select{padding:.45rem .6rem; background:var(--panou-2);
    border:1px solid var(--linie); border-radius:7px; color:var(--text)}
  .bara input[type=search]{min-width:240px}
  .bara .titlu{font:700 1rem/1 Georgia,serif; color:var(--text); margin-right:.5rem}

  .cuprins{flex:1; overflow:auto; padding:0 1.25rem 3rem}
  table{width:100%; border-collapse:collapse; font-size:.88rem}
  thead th{position:sticky; top:0; background:var(--fundal); text-align:left;
    padding:.7rem .6rem; border-bottom:1px solid var(--linie);
    font-size:.74rem; letter-spacing:.06em; text-transform:uppercase; color:var(--text-sters)}
  tbody td{padding:.55rem .6rem; border-bottom:1px solid var(--panou-2); vertical-align:top}
  tbody tr:hover{background:var(--panou)}
  .cand{color:var(--text-sters); white-space:nowrap; font-variant-numeric:tabular-nums}
  th.suma,td.suma{text-align:right}
  .suma{font-variant-numeric:tabular-nums; white-space:nowrap}
  .plus{color:var(--verde)} .minus{color:var(--rosu)}
  .eticheta{display:inline-block; padding:.1rem .45rem; border-radius:4px; font-size:.72rem;
    background:var(--panou-2); border:1px solid var(--linie); color:var(--text-sters)}
  .eticheta.live{color:var(--verde); border-color:color-mix(in srgb,var(--verde) 45%,transparent)}
  /* detaliile, ca text citibil: eticheta stinsa, valoarea clara -- se vad dintr-o privire,
     fara sa mai apesi pe nimic */
  .det{display:inline-block; margin:0 .7rem .15rem 0; font-size:.79rem; white-space:nowrap}
  .det b{font-weight:500; color:var(--text-sters); margin-right:.25rem}
  .gol{padding:3rem 1rem; text-align:center; color:var(--text-sters)}
  .subsol{padding:1rem; text-align:center}

  @media (max-width:760px){
    #app.pornit{grid-template-columns:1fr; height:auto; min-height:100vh}
    aside{border-right:0; border-bottom:1px solid var(--linie)}
  }
</style>
</head>
<body>

<div id="login">
  <form id="formLogin">
    <h1>Loguri server</h1>
    <p>Intra cu contul primit de la administrator.</p>
    <label for="utilizator">Utilizator</label>
    <input id="utilizator" type="text" autocomplete="username" autocapitalize="off"
           spellcheck="false" required>
    <label for="parola">Parola</label>
    <input id="parola" type="password" autocomplete="current-password" required>
    <p class="eroare" id="eroareLogin"></p>
    <button class="principal" id="btnLogin" type="submit">Intra</button>
  </form>
</div>

<div id="app">
  <aside>
    <h1>Loguri server</h1>
    <div class="cine" id="cine"></div>
    <nav id="categorii"><div class="titlu">Categorii</div></nav>

    <!-- Ascuns pentru toata lumea. Se arata doar daca baza de date raspunde ca ai voie --
         pagina nu hotaraste asta singura, doar intreaba. -->
    <div id="administrare" hidden>
      <div class="titluAdmin">Administrare</div>
      <button class="mic periculos" id="btnStergeZile">Sterge ultimele 10 zile</button>
      <button class="mic periculos" id="btnStergeTot">Sterge tot</button>
    </div>

    <footer>
      <button class="mic" id="btnIesire">Iesire</button>
      <!-- Marcajul de versiune: GitHub Pages si browserul tin pagina in cache, deci dupa ce
           urci fisierul nou poti ramane minute bune cu cel vechi pe ecran, fara niciun semn.
           Numarul asta il schimb la fiecare modificare -- daca nu-l vezi crescut, inseamna ca
           te uiti tot la varianta veche, nu ca modificarea n-a mers. -->
      <span class="versiune">v7 &middot; 08.08</span>
    </footer>
  </aside>

  <main>
    <div class="bara">
      <span class="titlu" id="titluCategorie">Toate</span>
      <input id="fJucator" type="search" placeholder="Cauta dupa jucator...">
      <select id="fSursa">
        <option value="">Toate serverele</option>
        <option value="live">Live</option>
        <option value="local">Local</option>
      </select>
      <button class="mic" id="btnReimprospatare">Reimprospateaza</button>
    </div>

    <div class="cuprins">
      <table>
        <thead><tr>
          <th>Cand</th><th>Ce s-a intamplat</th><th>Jucator</th>
          <th class="suma">Suma</th><th>Server</th><th>Detalii</th>
        </tr></thead>
        <tbody id="randuri"></tbody>
      </table>
      <div class="gol" id="gol" hidden>Niciun log care sa se potriveasca.</div>
      <div class="subsol"><button class="mic" id="btnMaiMulte" hidden>Incarca mai multe</button></div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// Cheia de mai jos e PUBLICA si e normal sa stea la vedere -- asa e gandit Supabase. Ce se
// poate citi de fapt e hotarat de regulile din baza de date ("doar cine e logat"). Cheia
// periculoasa e cea secreta, si aia sta doar in server.cfg.
const URL_SUPABASE = 'https://lydecmuiejqftwofxinx.supabase.co';
const CHEIE_PUBLICA = 'sb_publishable_xNIm-yK7WkvEelJn2MA9PA_GG50V0U-';
const sb = supabase.createClient(URL_SUPABASE, CHEIE_PUBLICA);

// Nume frumoase. Ce nu e aici se afiseaza asa cum vine din baza de date, deci o categorie
// noua apare in stanga chiar daca uit sa o trec pe lista.
const NUME = {
  bani:'Bani', depozit:'Depozit', job:'Joburi', activitate:'Activitati', craft:'Craft',
  lege:'Lege', admin:'Admin', moarte:'Morti',
  // bani -- impartite dupa ACTIVITATE, nu dupa scriptul care a mutat banii
  banca:'Banca', magazine:'Magazine', vanatoare:'Vanatoare', pescuit:'Pescuit',
  cules:'Cules plante', minerit:'Minerit', lemn:'Lemn', petrol:'Petrol',
  agricultura:'Agricultura', ferme:'Ferme', joburi:'Joburi', salarii:'Salarii',
  proprietati:'Proprietati', amenzi:'Amenzi si facturi', jafuri:'Jafuri', altele:'Altele',
  // depozit -- dupa felul depozitului, ca sa nu se amestece caruta cu casa
  carute:'Carute', case:'Case', cufere:'Cufere', ['intre jucatori']:'Intre jucatori',
  aruncate:'Aruncate pe jos',
  // activitati -- ce a MUNCIT jucatorul (culesul unui oregano, nu banii pe el)
  legendare:'Legendare', animale:'Animale', obiecte:'Obiecte', bautura:'Bautura',
  // lege si joburi
  catuse:'Catuse', perchezitii:'Perchezitii', confiscari:'Confiscari', inchisoare:'Inchisoare',
  ['tura politie']:'Tura de politie',
  // admin
  actiuni:'Actiuni asupra jucatorilor', ['iteme si bani']:'Dat si sters iteme/bani',
  noclip:'Noclip',
  jucatori:'Asupra jucatorilor', troll:'Troll', sine:'Asupra lui insusi',
  teleport:'Teleportari', tichete:'Tichete',
  // morti
  ['ucis de jucator']:'Ucis de jucator', accidente:'Accidente', ['alte morti']:'Alte morti',
};
const nume = (x) => NUME[x] || (x ? x.charAt(0).toUpperCase() + x.slice(1) : 'Fara subcategorie');

// Ordinea in care vrem categoriile. Ce nu e aici vine la coada, alfabetic.
const ORDINE = ['bani','depozit','activitate','craft','job','lege','moarte','admin'];

// Le aratam pe TOATE, chiar si pe cele goale. Altfel n-ai cum sa stii daca o categorie e goala
// pentru ca nu s-a intamplat nimic, sau pentru ca nu o urmarim deloc -- un zero spune ceva,
// absenta nu spune nimic. Categoriile noi care apar in baza de date se adauga oricum singure.
const MEREU_ARATATE = ORDINE;

// Toate subcategoriile, inclusiv ale categoriilor inca neconstruite (joburi, activitati, craft,
// lege). Sunt harta a ce urmeaza sa se logheze -- un zero acolo inseamna "nu e gata inca", nu
// "nu s-a intamplat nimic". Se vad permanent, nu se desfac la click.
const SUBCATEGORII_STIUTE = {
  // Ordinea nu e alfabetica, e dupa cat de des te uiti la ele: banii care intra si ies din
  // banca si din magazine sunt primii, cei din munca la mijloc, cazurile rare la coada.
  bani:       ['banca','magazine','vanatoare','pescuit','cules','minerit','lemn','petrol',
               'agricultura','ferme','joburi','salarii','proprietati','amenzi','jafuri',
               'admin','altele'],
  depozit:    ['carute','ferme','case','cufere','intre jucatori','aruncate'],
  activitate: ['cules','minerit','pescuit','vanatoare','legendare','lemn','petrol',
               'agricultura','animale','jafuri','joburi'],
  craft:      ['obiecte','bautura'],
  job:        ['tura politie'],
  lege:       ['catuse','perchezitii','confiscari','inchisoare'],
  moarte:     ['ucis de jucator','accidente','alte morti'],
  admin:      ['actiuni','iteme si bani','teleport','troll','jucatori','sine','noclip','tichete'],
};

const PE_PAGINA = 100;
let categorie = '', subcategorie = '', dela = 0, seIncarca = false;

// Cate zile sterge butonul "Sterge ultimele N zile". Schimbi aici si se schimba si eticheta.
const ZILE_DE_STERS = 10;

// Totalul din stanga, tinut minte ca sa-l putem arata in intrebarea de confirmare -- "stergi
// 8.412 loguri?" te face sa te gandesti altfel decat "stergi tot?".
let totalLoguri = 0;

const $ = (id) => document.getElementById(id);
const curat = (t) => String(t ?? '').replace(/</g, '&lt;');

// Login cu utilizator: Supabase lucreaza doar cu adrese, asa ca lipim singuri partea de dupa @.
// Daca omul scrie o adresa intreaga, o lasam asa -- ca o greseala la creare sa nu blocheze pe nimeni.
const caEmail = (s) => { const c = s.trim().toLowerCase(); return c.includes('@') ? c : c + '@loguri.local'; };
const caUtilizator = (e) => (e || '').split('@')[0];

$('formLogin').addEventListener('submit', async (e) => {
  e.preventDefault();
  $('eroareLogin').textContent = '';
  $('btnLogin').disabled = true;
  const { error } = await sb.auth.signInWithPassword({
    email: caEmail($('utilizator').value), password: $('parola').value });
  $('btnLogin').disabled = false;
  if (error) { $('eroareLogin').textContent = 'Utilizator sau parola gresita.'; return; }
  porneste();
});

$('btnIesire').addEventListener('click', async () => { await sb.auth.signOut(); location.reload(); });

// ---------------------------------------------------------------------------
// Lista din stanga -- construita din ce EXISTA in baza de date
// ---------------------------------------------------------------------------
function alege(cat, sub, titlu, el) {
  categorie = cat; subcategorie = sub;
  $('titluCategorie').textContent = titlu;
  for (const b of document.querySelectorAll('#categorii .rand')) b.classList.remove('activ');
  el.classList.add('activ');
  incarca(true);
}

async function deseneazaCategorii() {
  const { data, error } = await sb.rpc('contor_loguri');
  const nav = $('categorii');
  nav.innerHTML = '<div class="titlu">Categorii</div>';

  if (error) { console.error(error); return; }

  // grupam pe categorie si adunam totalurile
  const grupe = new Map();
  let total = 0;

  // pornim cu toate categoriile pe zero, ca sa se vada si cele in care inca nu s-a intamplat nimic
  for (const c of MEREU_ARATATE) {
    grupe.set(c, { cate: 0, sub: (SUBCATEGORII_STIUTE[c] || []).map(id => ({ id, cate: 0 })) });
  }

  for (const r of data || []) {
    if (!grupe.has(r.categorie)) grupe.set(r.categorie, { cate: 0, sub: [] });
    const g = grupe.get(r.categorie);
    g.cate += Number(r.cate);
    total += Number(r.cate);

    // daca subcategoria era deja pe lista (cu zero), ii punem numarul real in loc sa o dublam
    const existenta = g.sub.find(s => s.id === r.subcategorie);
    if (existenta) existenta.cate = Number(r.cate);
    else g.sub.push({ id: r.subcategorie, cate: Number(r.cate) });
  }

  const faRand = (text, cate, alClick, clase) => {
    const b = document.createElement('button');
    b.className = 'rand' + (clase ? ' ' + clase : '');
    b.innerHTML = `<span>${curat(text)}</span><span class="nr">${cate}</span>`;
    b.addEventListener('click', alClick);
    return b;
  };

  totalLoguri = total;

  // "Toate"
  const toate = faRand('Toate', total, () => alege('', '', 'Toate', toate));
  toate.classList.add('activ');
  nav.appendChild(toate);

  const chei = [...grupe.keys()].sort((a, b) => {
    const ia = ORDINE.indexOf(a), ib = ORDINE.indexOf(b);
    return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib) || a.localeCompare(b);
  });

  for (const cat of chei) {
    const g = grupe.get(cat);
    const cutie = document.createElement('div');
    const capat = document.createElement('button');
    capat.className = 'rand capat';
    capat.innerHTML = `<span>${curat(nume(cat))}</span><span class="nr">${g.cate}</span>`;

    // Subcategoriile stau deschise mereu -- nimic de apasat ca sa se vada. Click pe categorie
    // inseamna doar "arata-mi tot ce e in ea".
    const sub = document.createElement('div');
    sub.className = 'sub';

    capat.addEventListener('click', () => alege(cat, '', nume(cat), capat));

    // ordinea din SUBCATEGORII_STIUTE, ca lista sa stea pe loc si sa nu sara randurile cand
    // se schimba numerele
    for (const s of g.sub.filter(s => s.id)) {
      const b = faRand(nume(s.id), s.cate, () => alege(cat, s.id, `${nume(cat)} · ${nume(s.id)}`, b));
      sub.appendChild(b);
    }

    cutie.appendChild(capat);
    cutie.appendChild(sub);
    nav.appendChild(cutie);
  }
}

// ---------------------------------------------------------------------------
// Tabelul
// ---------------------------------------------------------------------------
const candFormatat = (iso) => new Date(iso).toLocaleString('ro-RO',
  { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit', second:'2-digit' });

function celulaSuma(r) {
  if (r.amount === null || r.amount === undefined) return '<td class="suma">-</td>';
  // "A platit" scade, "A primit" adauga -- semnul si culoarea fac tabelul citibil dintr-o privire
  const scade = /plat|scos|sub|remove/i.test(r.action || '');
  return `<td class="suma ${scade ? 'minus' : 'plus'}">${scade ? '-' : '+'}${
    Number(r.amount).toLocaleString('ro-RO')}</td>`;
}

// Detaliile veneau ca JSON brut -- corect, dar de necitit pentru cine nu scrie cod.
// Le scoatem ca text simplu: "Item: carne · Depozit: caruta 12".
//
// Cheile pe care le sarim sunt cele tehnice (id-uri interne): nu-i spun nimic omului care se
// uita in loguri, iar propozitia din coloana principala zice deja despre cine e vorba.
const ETICHETE = {
  item:'Item', depozit:'Depozit', catre:'Catre', moneda:'Moneda', ramas:'Ramas',
  resursa:'Script', arma:'Arma', loc:'Loc', coordonate:'Coordonate', grad:'Grad',
  asupra:'Asupra', mesaj:'Mesaj', tichet:'Tichet', unde:'Unde',
  // adaugate pentru Lege si tichete
  minute:'Minute', tinta:'Tinta', subiect:'Subiect',
};
// Id-urile interne ale itemelor si armelor confiscate nu-i spun nimic nimanui -- numele
// jucatorului si cantitatea sunt deja in propozitie.
const SARITE = new Set(['catre_id', 'asupra_id', 'id_item', 'id_arma']);

const numar = (n) => n.toLocaleString('ro-RO', { maximumFractionDigits: 2 });

function detaliiCitibile(d) {
  if (!d || typeof d !== 'object') return '';

  const bucati = [];
  for (const [cheie, val] of Object.entries(d)) {
    if (val === null || val === undefined || val === '' || SARITE.has(cheie)) continue;
    const eticheta = ETICHETE[cheie] || (cheie.charAt(0).toUpperCase() + cheie.slice(1));
    const text = typeof val === 'number' ? numar(val)
               : typeof val === 'object' ? JSON.stringify(val)
               : String(val);
    bucati.push(`<span class="det"><b>${curat(eticheta)}</b> ${curat(text)}</span>`);
  }
  return bucati.join('');
}

function adaugaRanduri(date) {
  const corp = $('randuri');
  for (const r of date) {
    const tr = document.createElement('tr');
    const detalii = detaliiCitibile(r.details);
    tr.innerHTML =
      `<td class="cand">${candFormatat(r.created_at)}</td>` +
      `<td>${curat(r.action)}</td>` +
      `<td>${curat(r.player_name)}${r.char_id ? ` <span class="eticheta">#${r.char_id}</span>` : ''}</td>` +
      celulaSuma(r) +
      `<td><span class="eticheta ${r.source === 'live' ? 'live' : ''}">${curat(r.source) || '?'}</span></td>` +
      `<td>${detalii}</td>`;
    corp.appendChild(tr);
  }
}

async function incarca(dinNou) {
  if (seIncarca) return;
  seIncarca = true;
  if (dinNou) { dela = 0; $('randuri').innerHTML = ''; }

  let q = sb.from('logs').select('*')
    .order('created_at', { ascending:false }).range(dela, dela + PE_PAGINA - 1);

  const sursa = $('fSursa').value, jucator = $('fJucator').value.trim();
  if (categorie) q = q.eq('category', categorie);
  if (subcategorie) q = q.eq('subcategory', subcategorie);
  if (sursa) q = q.eq('source', sursa);
  if (jucator) q = q.ilike('player_name', `%${jucator}%`);

  const { data, error } = await q;
  seIncarca = false;
  if (error) { console.error(error); return; }

  adaugaRanduri(data);
  dela += data.length;
  $('gol').hidden = dela !== 0;
  $('btnMaiMulte').hidden = data.length < PE_PAGINA;
}

let asteapta;
$('fJucator').addEventListener('input', () => {
  // asteptam sa termine de scris, ca sa nu intrebam baza de date la fiecare litera
  clearTimeout(asteapta);
  asteapta = setTimeout(() => incarca(true), 350);
});
$('fSursa').addEventListener('change', () => incarca(true));
$('btnReimprospatare').addEventListener('click', () => { incarca(true); deseneazaCategorii(); });
$('btnMaiMulte').addEventListener('click', () => incarca(false));

// ---------------------------------------------------------------------------
// Stergerea logurilor -- doar pentru proprietar
// ---------------------------------------------------------------------------
// Butoanele nu sunt securitate, sunt comoditate. Cine are voie se hotaraste in baza de date,
// in `pot_sterge()`, si tot acolo se verifica din nou la stergerea propriu-zisa. Daca cineva
// cheama functia din consola browserului, primeste refuz de la Postgres, nu de la pagina.
async function verificaDrepturile() {
  const { data, error } = await sb.rpc('pot_sterge');
  // Daca functia inca nu e creata in Supabase, nu e o eroare de care sa se impiedice cineva:
  // pur si simplu nu apar butoanele.
  if (error) { console.warn('pot_sterge:', error.message); return; }
  $('administrare').hidden = !data;
}

async function sterge(zile, intrebare) {
  if (!confirm(intrebare)) return;

  const butoane = [$('btnStergeTot'), $('btnStergeZile')];
  for (const b of butoane) b.disabled = true;

  const { data, error } = await sb.rpc('sterge_logurile', { zile });

  for (const b of butoane) b.disabled = false;

  if (error) { alert('Nu s-a putut sterge: ' + error.message); return; }

  alert(`Sters: ${Number(data).toLocaleString('ro-RO')} loguri.`);
  await deseneazaCategorii();
  incarca(true);
}

$('btnStergeTot').addEventListener('click', () => sterge(null,
  `Stergi TOATE cele ${totalLoguri.toLocaleString('ro-RO')} loguri?\n\nNu se poate da inapoi.`));

$('btnStergeZile').textContent = `Sterge ultimele ${ZILE_DE_STERS} zile`;
$('btnStergeZile').addEventListener('click', () => sterge(ZILE_DE_STERS,
  `Stergi logurile din ultimele ${ZILE_DE_STERS} zile?\n\n` +
  `Cele mai vechi de atat raman. Nu se poate da inapoi.`));

async function porneste() {
  const { data:{ user } } = await sb.auth.getUser();
  if (!user) return;
  $('login').style.display = 'none';
  $('app').classList.add('pornit');
  $('cine').textContent = caUtilizator(user.email);
  await deseneazaCategorii();
  verificaDrepturile();
  incarca(true);
}

sb.auth.getSession().then(({ data:{ session } }) => { if (session) porneste(); });
</script>
